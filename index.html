
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090909">
  <title>PEYSƏR DEDEKTORU 10.5</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 20px 8px;
      border-bottom: 2px solid #e50914;
      background: #141414;
    }

    h1 {
      margin: 0;
      color: #ff2020;
      font-size: 23px;
      letter-spacing: 1px;
    }

    .version {
      color: #aaa;
      font-size: 12px;
      margin-top: 7px;
    }

    #status {
      margin: 14px 10px;
      color: #ffd54a;
      font-size: 14px;
    }

    .camera {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      min-height: 240px;
      aspect-ratio: 3 / 4;
      max-height: 65vh;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
    }

    video { transform: scaleX(1); }
    canvas { pointer-events: none; }

    #alert {
      display: none;
      background: #c90000;
      color: white;
      padding: 14px;
      font-weight: bold;
      animation: flash .7s infinite alternate;
    }

    @keyframes flash {
      from { opacity: 1; }
      to { opacity: .55; }
    }

    .controls {
      padding: 16px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 15px 8px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: #252525;
    }

    #start { background: #b60000; }
    button:disabled { opacity: .45; }

    .info {
      margin: 0 15px 20px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>PEYSƏR DEDEKTORU</h1>
    <div class="version">HTML5 • VERSION 10.5</div>
  </header>

  <div id="status">Model yüklənir...</div>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="alert">⚠ İNSAN AŞKARLANDI!</div>

  <div class="controls">
    <button id="start" disabled>KAMERANI AÇ</button>
    <button id="switch" disabled>KAMERANI DƏYİŞ</button>
    <button id="sound">🔊 SƏSİ AKTİV ET</button>
    <button id="stop" disabled>DAYANDIR</button>
  </div>

  <div class="info">
    Sistem kamera görüntüsündə insanları aşkar etməyə çalışır.
    Kamera icazəsi tələb olunur. İlk model yüklənməsi internet
    bağlantısı tələb edir.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const alertEl = document.getElementById("alert");

    let model = null;
    let stream = null;
    let facingMode = "environment";
    let running = false;
    let soundEnabled = false;
    let lastAlert = 0;
    let busy = false;

    async function loadModel() {
      try {
        statusEl.textContent = "Süni intellekt modeli yüklənir...";
        model = await cocoSsd.load();
        statusEl.textContent = "Hazırdır. Kameranı aça bilərsən.";
        document.getElementById("start").disabled = false;
      } catch (err) {
        statusEl.textContent =
          "Model yüklənmədi. İnternet bağlantısını yoxla.";
        console.error(err);
      }
    }

    async function startCamera() {
      if (!model) return;

      stopCamera();

      try {
        statusEl.textContent = "Kamera icazəsi gözlənilir...";

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 640 },
            height: { ideal: 800 }
          }
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        document.getElementById("stop").disabled = false;
        document.getElementById("switch").disabled = false;
        document.getElementById("start").textContent = "YENİDƏN AÇ";

        statusEl.textContent = "İnsan aşkarlanması aktivdir.";
        detectLoop();
      } catch (err) {
        statusEl.textContent =
          "Kamera açıla bilmədi. İcazəni və HTTPS bağlantısını yoxla.";
        console.error(err);
      }
    }

    function stopCamera() {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      alertEl.style.display = "none";

      document.getElementById("stop").disabled = true;
      document.getElementById("switch").disabled = true;
      statusEl.textContent = model
        ? "Dayandırılıb."
        : "Model yüklənir...";
    }

    async function detectLoop() {
      if (!running || busy || !model) return;
      if (video.readyState < 2) {
        requestAnimationFrame(detectLoop);
        return;
      }

      busy = true;

      try {
        const predictions = await model.detect(video);
        if (!running) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const people = predictions.filter(p =>
          p.class === "person" && p.score >= 0.55
        );

        for (const person of people) {
          const [x, y, w, h] = person.bbox;

          ctx.strokeStyle = "#ff1010";
          ctx.lineWidth = Math.max(3, canvas.width / 180);
          ctx.strokeRect(x, y, w, h);

          const label = "INSAN " +
            Math.round(person.score * 100) + "%";

          ctx.font = "bold 16px Arial";
          const labelWidth = ctx.measureText(label).width + 12;
          const labelY = Math.max(0, y - 28);

          ctx.fillStyle = "#e60000";
          ctx.fillRect(x, labelY, labelWidth, 27);

          ctx.fillStyle = "#ffffff";
          ctx.fillText(label, x + 6, labelY + 19);
        }

        if (people.length > 0) {
          statusEl.textContent =
            "İnsan sayı: " + people.length;
          alertEl.style.display = "block";
          warn();
        } else {
          statusEl.textContent = "İnsan aşkarlanmadı.";
          alertEl.style.display = "none";
        }
      } catch (err) {
        console.error(err);
      } finally {
        busy = false;
        if (running) {
          setTimeout(detectLoop, 100);
        }
      }
    }

    function warn() {
      const now = Date.now();

      // Xəbərdarlıq təkrarını 2 saniyədə bir məhdudlaşdır.
      if (now - lastAlert < 2000) return;
      lastAlert = now;

      if (soundEnabled) {
        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          const audio = new AudioContextClass();
          const oscillator = audio.createOscillator();
          const gain = audio.createGain();

          oscillator.type = "square";
          oscillator.frequency.value = 880;
          gain.gain.value = 0.15;

          oscillator.connect(gain);
          gain.connect(audio.destination);

          oscillator.start();
          oscillator.stop(audio.currentTime + 0.25);
          oscillator.onended = () => audio.close();
        } catch (err) {
          console.error(err);
        }
      }

      if ("vibrate" in navigator) {
        navigator.vibrate(250);
      }
    }

    document.getElementById("start").addEventListener(
      "click", startCamera
    );

    document.getElementById("stop").addEventListener(
      "click", stopCamera
    );

    document.getElementById("switch").addEventListener(
      "click", async () => {
        facingMode = facingMode === "environment"
          ? "user"
          : "environment";
        await startCamera();
      }
    );

    document.getElementById("sound").addEventListener(
      "click", () => {
        soundEnabled = !soundEnabled;
        document.getElementById("sound").textContent =
          soundEnabled ? "🔊 SƏS AKTİVDİR" : "🔇 SƏS SÖNÜB";
      }
    );

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent =
        "Kamera üçün HTTPS bağlantısı tələb olunur.";
    }

    loadModel();
  </script>
</body>
</html>
